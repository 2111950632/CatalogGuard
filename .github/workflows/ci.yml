name: Check SZS
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install official MoonBit toolchain
        run: |
          curl --fail --show-error --location https://cli.moonbitlang.com/install/unix.sh -o /tmp/install-moonbit.sh
          bash /tmp/install-moonbit.sh
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Record toolchain and check core
        run: |
          moon version --all | tee toolchain-version.txt
          node --version >> toolchain-version.txt
          moon check --target all --deny-warn
          moon fmt --check
          moon info
          git diff --exit-code -- '*.mbti'
      - name: Test both JavaScript and Wasm GC
        run: |
          moon test --target js --deny-warn
          moon test --target wasm-gc --deny-warn
          moon build --target js --release --deny-warn
          node --test tests/integration.mjs
      - name: Compare with independent parsers and GNU gettext
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext
          python -m venv .ci-venv
          .ci-venv/bin/python -m pip install polib==1.2.0
          msgfmt --version >> toolchain-version.txt
          node scripts/fetch-fixtures.mjs
          .ci-venv/bin/python tests/oracle.py tests/external/moonbit-docs-0.po tests/external/moonbit-docs-1.po --gnu | tee independent-verification.txt
      - name: Test independently extracted Mooncakes package
        run: |
          moon package
          python scripts/check-consumer.py
      - name: Record source counts and package JS core
        run: |
          node scripts/count-source.mjs > source-count.json
          node scripts/package.mjs
          node cli.mjs examples/zh_CN.po --template examples/messages.pot --strict --json > demo-report.json
      - name: Save verification artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: szs-verification
          path: |
            source-count.json
            toolchain-version.txt
            independent-verification.txt
            demo-report.json
            dist/
            _build/publish/*.zip
          if-no-files-found: warn
